name: Tests and Samsung build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm.cmd ci
      - name: Unit tests
        run: npm.cmd run test:run
      - name: Build public archive
        run: npm.cmd run release:prepare
      - name: Upload build and checksum
        uses: actions/upload-artifact@v7
        with:
          name: KinoWatch-build
          path: |
            artifacts/KinoWatch-*-build.zip
            artifacts/KinoWatch-*-build.zip.sha256
          if-no-files-found: error
          retention-days: 14
